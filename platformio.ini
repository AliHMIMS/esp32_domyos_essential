; Domyos Essential -> ESP32-C6 (ESP32-C6-DevKitC-1 / WROOM-1)
;
; The official espressif32 platform ships Arduino core 2.x, which has no
; ESP32-C6 support, so we use the community pioarduino fork (Arduino core 3.x).
;
; First flash:   pio run -e usb -t upload        (CH343 USB-C port)
; Later updates: pio run -e ota -t upload        (over Wi-Fi, domyos.local)

[platformio]
default_envs = usb
extra_configs = secrets.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0

[env:usb]
upload_speed = 921600

; HTTP upload to the firmware's /update endpoint (no firewall rule needed).
[env:ota]
upload_protocol = custom
upload_command = curl --fail -sS --max-time 180 -u admin:${secrets.ota_password} -F "firmware=@$SOURCE" http://${secrets.ota_host}/update
